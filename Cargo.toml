[package]
name = "subgate"
version = "0.2.0"
edition = "2021"
description = "Single-binary subscription gateway for VLESS+Reality, fronted by nginx-compatible static responses"
license = "AGPL-3.0-or-later"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
